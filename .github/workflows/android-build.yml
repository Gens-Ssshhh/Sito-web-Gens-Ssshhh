name: Build Android APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installazione Dipendenze
        run: npm install

      - name: Definizione data release
        id: release
        env:
          TZ: 'Europe/Rome'
        run: |
          echo "release_date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "release_id=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "release_time=$(date +%H-%M)" >> "$GITHUB_OUTPUT"

      - name: Preparazione metadati APK
        env:
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const metadataPath = 'www/release.json';
          const metadata = JSON.parse(fs.readFileSync(metadataPath, 'utf8'));
          metadata.version = `1.0.${process.env.RELEASE_ID}`;
          metadata.releaseDate = process.env.RELEASE_DATE;
          metadata.releaseId = process.env.RELEASE_ID;
          fs.writeFileSync(metadataPath, `${JSON.stringify(metadata, null, 2)}\n`);
          NODE
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Compilazione APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          RELEASE_TIME=${{ steps.release.outputs.release_time }}
          RELEASE_DATE=${{ steps.release.outputs.release_date }}
          RELEASE_ID=${{ steps.release.outputs.release_id }}
          ./gradlew assembleDebug -PreleaseDate=$RELEASE_ID
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Gens-Ssshhh-App-${RELEASE_DATE}_${RELEASE_TIME}.apk

      - name: Salvataggio APK
        uses: actions/upload-artifact@v4
        with:
          name: Gens-Ssshhh-App-${{ steps.release.outputs.release_date }}_${{ steps.release.outputs.release_time }}
          path: android/app/build/outputs/apk/debug/Gens-Ssshhh-App-*.apk